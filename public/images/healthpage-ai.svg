<svg width="580" height="160" viewBox="0 0 580 160" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Gradiente azul -> verde usado no ícone e no "AI" -->
    <linearGradient id="medGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D8BCF"/>
      <stop offset="100%" stop-color="#36C48B"/>
    </linearGradient>
  </defs>

  <!-- Documento -->
  <path d="M40 20 H85 L110 45 V120 Q110 130 100 130 H40 Q30 130 30 120 V30 Q30 20 40 20 Z"
        stroke="url(#medGradient)" stroke-width="6" fill="none" stroke-linejoin="round"/>

  <!-- Dobra do documento -->
  <path d="M85 20 V40 Q85 45 90 45 H110"
        stroke="url(#medGradient)" stroke-width="6" fill="none"/>

  <!-- Cruz médica -->
  <rect x="50" y="35" width="8" height="24" rx="2" fill="#2BBF9B"/>
  <rect x="42" y="43" width="24" height="8" rx="2" fill="#2BBF9B"/>

  <!-- Linhas do documento -->
  <rect x="45" y="70" width="40" height="6" rx="3" fill="#5C6F91"/>
  <rect x="45" y="85" width="30" height="6" rx="3" fill="#5C6F91"/>

  <!-- Sparkles -->
  <path d="M95 95 L100 105 L110 110 L100 115 L95 125 L90 115 L80 110 L90 105 Z"
        fill="#2BBF9B"/>

  <path d="M75 100 L78 106 L85 108 L78 110 L75 116 L72 110 L65 108 L72 106 Z"
        fill="#2D8BCF"/>

  <!-- Texto HealthPage -->
  <text x="150" y="95"
        font-family="Inter, Arial, sans-serif"
        font-size="64"
        font-weight="600"
        fill="#2F3F63">
        HealthPage
  </text>

  <!-- Texto AI com gradiente -->
  <text x="510" y="95"
        font-family="Inter, Arial, sans-serif"
        font-size="64"
        font-weight="600"
        fill="url(#medGradient)">
        AI
  </text>

</svg>